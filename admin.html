<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4fff"><title>Admin</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="box"><h2>Admin login</h2><small>Enter the admin password to manage products.</small><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="lb" class="btn">Log in</button><p id="le" class="err" style="margin:0"></p></div>
<div id="app" hidden><header><b id="sn"></b><div class="acts"><button class="btn" id="addb">+ Add product</button><button class="btn alt" id="exp">Export CSV</button><button class="btn alt" id="tpl">Template</button><label class="btn alt">Import<input id="imp" type="file" accept=".csv,.xlsx,.xls" hidden></label><button class="btn alt" id="lo">Log out</button></div></header>
<div class="wrap"><section id="st" class="stats"></section><div class="bar"><input id="aq" class="s" type="search" placeholder="Search products"><div id="af" class="chip" hidden></div></div><div class="scroll"><div class="tb"><table id="tb"></table></div></div></div></div>
<dialog id="fm"></dialog><dialog id="pv"></dialog><dialog id="cf"></dialog><dialog id="cd"></dialog><div id="tl" hidden></div><div id="toast" popover="manual"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
